packages:
  - ./*
  - ./test/fixtures/*

catalogs:
  a12:
    "@com.mgmtp.a12.base/base-model-api": ^30.1.0
catalog:
  "@com.mgmtp.a12.devtools/build-tools": ^1.1.2
  "@com.mgmtp.a12.devtools/eslint-config": ^4.0.0
  "@com.mgmtp.a12.devtools/prettier-config": ^1.1.1
  "@com.mgmtp.a12.devtools/tsconfig": ^2.0.1
  "@eslint/compat": ^2.1.0
  "@playwright/test": ^1.62.1
  "@types/fs-extra": ^11.0.1
  "@types/git-diff": ^2.0.7
  "@types/inquirer": ^9.0.9
  "@types/node": ^22.13.11
  "@types/run-parallel-limit": ^1.0.3
  "@types/semver": ^7.5.0
  "@types/yargs": ^17.0.24
  eslint: ^10.4.1
  eslint-plugin-notice: ^1.0.0
  execa: ^9.6.1
  fs-extra: ^11.1.1
  git-diff: ^2.0.6
  glob: ^13.0.6
  inquirer: ^12.5.0
  json5: ^2.2.3
  prettier: ^3.7.4
  rimraf: ^6.1.3
  typescript: 6.0.3
  vite: ^8.0.16
  vitest: ^4.1.8
lockfileIncludeTarballUrl: false
# CI sets this to warn by default
loglevel: info
strictPeerDependencies: true
minimumReleaseAge: 10080
# Internal A12 packages are consumed immediately after publish; the age gate must not apply.
minimumReleaseAgeExclude:
  - "@com.mgmtp.a12.*/*"
patchedDependencies:
  "better-ajv-errors@1.2.0": patches/better-ajv-errors@1.2.0.patch
overrides:
  "brace-expansion@>=1.0.0 <=1.1.11": ">=1.1.12"
  "brace-expansion@>=2.0.0 <=2.0.1": ">=2.0.2"
peerDependencyRules:
  # eslint-plugin-import / -react ship stale eslint peer ranges that cap at v9;
  # they work with eslint 10 under flat config (verified via lint).
  allowedVersions:
    "eslint-plugin-import>eslint": "10"
    "eslint-plugin-react>eslint": "10"
allowBuilds:
  esbuild: true
